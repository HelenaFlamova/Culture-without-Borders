*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth}body{margin:0;background:#e8dcdd;color:var(--black);font:18px/1.58 'Playfair Display',Georgia,serif;-webkit-font-smoothing:antialiased}button,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.14}p{margin-bottom:15px}.shell{max-width:580px;min-height:100dvh;background:var(--ivory);margin:0 auto;box-shadow:0 0 50px rgba(0,0,0,.07)}.header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px max(13px,env(safe-area-inset-top));border-bottom:3px solid var(--black)}.brand{display:flex;align-items:center;gap:12px;text-align:left}.logo{display:grid;place-items:center;width:44px;height:44px;border:2px solid #fff;border-radius:50%;font:bold 15px Georgia,serif;transform:rotate(-9deg);flex:0 0 44px}.brand strong{font-size:19px;letter-spacing:-.03em;line-height:1.1;display:block}.brand small{font:700 10px Georgia,serif;letter-spacing:.16em;text-transform:uppercase;display:block;margin-top:4px}.passport{border:1px solid #e9c5c9;background:rgba(255,255,255,.10);color:#fff;border-radius:18px;font:700 13px Georgia,serif;padding:8px 11px;white-space:nowrap}.viewport{padding:20px 17px 65px;min-height:calc(100dvh - 75px)}.micro{font:700 11px/1.35 Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}.small{font-size:15px}.muted{color:var(--grey)}.hero{background:var(--black);color:#fff;padding:28px 24px 29px;border-radius:22px;overflow:hidden;position:relative}.hero .micro{color:#ffd4dc}.hero h1{font-size:clamp(44px,11vw,62px);letter-spacing:-.046em;line-height:1.05;margin:15px 0}.hero h1 em{font-style:normal;color:#ffb9c6}.hero p{font-size:17px;line-height:1.6;margin:0;max-wi dy{padding:24px 22px}.cover{width:100%;display:block;aspect-ratio:2 / 1;object-fit:cover;background:#e3d5d8}.cover-compact{aspect-ratio:3 / 1}.cover-label{background:var(--red);color:#fff;padding:19px 22px 20px}.cover-label .micro{color:#ffe3e8}.cover-label h2{font-size:clamp(29px,7vw,39px);margin:7px 0 3px}.cover-label p{margin:0;font-size:15px}.intro{font-size:19px;line-height:1.67;margin-bottom:22px}.notes-heading{font-size:26px;margin:20px 0 12px}.notes{display:grid;gap:12px}.note{background:var(--pale);border:1px solid #eadadb;border-left:5px solid var(--red);padding:17px 17px 16px;border-radius:11px}.note b{font:700 11px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}.note p{margin:7px 0 0;font-size:17px;line-height:1.65}.tip{background:#f5eaeb;border-radius:12px;padding:15px 16px;margin:16px 0;font-size:15px}.tip b{color:var(--red)}.btn{display:block;border:2px solid var(--red);background:var(--red);color:#fff;border-radius:13px;width:100%;padding:15px 17px;font:700 18px Georgia,serif;min-height:60px;text-align:center}.btn:hover:not(:disabled){background:var(--redDeep)}.btn.dark{background:var(--black);border-color:var(--black)}.btn.outline{background:#fff;color:var(--red)}.btn.mini{width:auto;padding:9px 15px;min-height:44px;font-size:14px}.btn-row{display:flex;gap:10px;align-items:center;margin-top:22px}.btn-row .btn:first-child{flex:1}.btn-row .btn:last-child:not(:first-child){width:105px}.progress-top{display:flex;justify-content:space-between;align-items:center;gap:14px;font:700 13px Georgia,serif;color:var(--grey);margin:4px 0 10px}.track{background:#e3d5d7;border-radius:99px;height:9px;overflow:hidden}.track i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .2s}.quiz-header{margin:20px 0 0}.quiz-header h2{font-size:clamp(26px,6.5vw,34px);margin:10px 0 20px;line-height:1.35}.kind{background:#fff;border:1px solid var(--line);border-radius:25px;display:inline-block;padding:5px 12px;font:700 11px Georgia,serif;color:var(--red);letter-spacing:.06em}.answers{display:grid;gap:11px}.answer{width:100%;display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:13px;background:#fff;padding:16px 13px;min-height:73px;text-align:left;color:var(--black);font-size:17px;line-height:1.48}.answer .letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:50%;color:var(--red);font:700 13px Georgia,serif}.answer.selected{border-color:var(--red);background:#f9eaed}.answer.selected .letter{background:var(--red);color:#fff;border-color:var(--red)}.helper{margin-top:14px;color:var(--grey);font:14px/1.6 Georgia,serif}.mini-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px}.mini-card label{display:block;font-size:16px;margin:0 0 8px;font-weight:700}.mini-card select{width:100%;background:var(--pale);border:1.5px solid #cfbfc1;color:var(--black);border-radius:8px;padding:12px 11px;font:15px/1.5 Georgia,serif;min-height:47px}.order-list{display:grid;gap:10px}.order-item{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px}.order-num{font:700 13px Georgia,serif;color:var(--red);flex:0 0 18px}.order-label{font-size:16px;flex:1}.arrows{display:grid;gap:5px}.arrows button{background:var(--ivory);border:1px solid var(--line);color:var(--red);border-radius:7px;min-width:41px;min-height:35px;font:700 19px Georgia,serif}.food-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:17px 0}.food-tile{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.food-tile img{width:100%;display:block;aspect-ratio:4 / 2.3;object-fit:cover}.food-tile span{display:block;font:700 13px/1.3 Georgia,serif;padding:9px;text-align:center}.foot-note{font:14px/1.55 Georgia,serif;color:var(--grey);margin:16px 0}.result-banner{background:var(--black);color:#fff;padding:27px 22px;text-align:center}.result-banner .micro{color:#f4b8c0}.result-banner strong{font-size:62px;display:block;line-height:1;margin:9px 0}.result-banner h2{font-size:30px;margin:9px 0}.result-banner p{font-size:17px;color:#f0e1e3;margin:0}.feedback{display:grid;gap:13px;margin:18px 0}.feedback-item{border:1px solid var(--line);border-left:5px solid var(--red);background:#fff;border-radius:12px;padding:17px}.feedback-item.correct{border-left-color:#352d2f}.feedback-item h3{font-size:19px;line-height:1.35;margin:7px 0 12px}.feedback-item .fact{background:var(--ivory);padding:13px;border-radius:10px;margin:12px 0 0;font-size:16px;line-height:1.62}.feedback-item .fact b{color:var(--red)}.feedback-key{font-size:16px;margin:8px 0}.feedback-key strong{color:var(--red)}.answer-map{display:grid;gap:5px;margin:7px 0}.answer-map span{font-size:15px}.congrats{background:var(--black);border-radius:22px;padding:32px 22px;text-align:center;color:#fff}.congrats .micro{color:#ffd5da}.seal{border:3px double #f2cdd3;border-radius:50%;width:125px;height:125px;margin:13px auto 19px;display:grid;place-items:center;transform:rotate(-8deg);font:700 14px Georgia,serif;letter-spacing:.14em}.congrats h1{font-size:44px;margin-bottom:15px}.congrats p{font-size:18px;color:#f0e7e7}.final-quote{font-size:23px!important;font-weight:700;color:#fff!important;margin:20px 0}.stampgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.stamp{background:#fff;border:1px dashed var(--red);border-radius:10px;text-align:center;padding:12px 6px;font-size:14px;font-weight:700}.name{width:100%;min-height:55px;border:1.5px solid var(--line);padding:13px;border-radius:11px;margin:8px 0 14px}.footer{text-align:center;color:var(--grey);font:12px/1.6 Georgia,serif;padding:12px 14px 34px}.footer button{border:0;background:none;color:var(--grey);font:inherit;text-decoration:underline}dialog{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:520px;max-height:85dvh;box-shadow:0 22px 80px rgba(0,0,0,.30);color:var(--black)}dialog::backdrop{background:rgba(20,11,13,.65)}.dialog-head{background:var(--red);padding:17px 20px;color:#fff;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font-size:24px;margin:0}.dialog-head button{background:transparent;border:1px solid #fff;border-radius:50%;color:#fff;font-size:23px;width:38px;height:38px;line-height:1}.dialog-inner{padding:19px;overflow-y:auto;max-height:calc(85dvh - 72px)}.dialog-inner .note{margin-bottom:12px}.hidden{display:none!important}@media(min-width:640px){.viewport{padding:25px 24px 70px}}@media(max-width:360px){.brand strong{font-size:17px}.logo{width:39px;height:39px;flex-basis:39px}.viewport{padding:15px 12px 56px}.card-body{padding:19px 16px}.hero h1{font-size:43px}.status{font-size:9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{.header,.footer,.btn,.back{display:none}.shell{max-width:none;box-shadow:none}}

<script>
/* DATA AND ILLUSTRATIONS ARE EMBEDDED. NO TEACHER NOTES APPEAR IN THE STUDENT INTERFACE. */
const MISSIONS = [
{
 code:'WALES',place:'Wales',title:'The Festival of Words',subtitle:'Eisteddfod',art:'wales',scene:'A festival where words matter',
 intro:'Your Welsh exchange partner takes you to a lively summer festival. You hear music and poetry, and people are competing on stage. But this is not an ordinary pop festival. What makes it special?',
 clues:[
  ['Clue 01 · Two languages','In Wales, you may see Welsh and English on the same signs. Welsh has survived for centuries, and many people are proud to speak it.'],
  ['Clue 02 · The performers','The festival celebrates language and the arts. Choirs (groups of singers), poets and musicians take part. A bard is a poet who performs or writes poetry.'],
  ['Clue 03 · A castle in the past','A prince called Lord Rhys held a famous gathering for musicians and poets at Cardigan Castle in 1176. The modern festival developed much later.']
 ],
 questions:[
 {type:'choice',q:'Your exchange partner says the Eisteddfod is an important national tradition. Which country are you visiting?',options:['Wales','Scotland','Ireland','England'],a:0,why:'The Eisteddfod celebrates Welsh culture and language. Wales is part of the United Kingdom, but it has its own cultural traditions.'},
 {type:'sort',q:'Which of these activities belong at an Eisteddfod? Put each activity in the right group.',categories:['Part of the festival','Not a main Eisteddfod event'],items:[['Poetry competition',0],['Choir performance',0],['Football league match',1],['Music competition',0]],why:'Poetry, choral singing and music are central to the festival. A football match may happen nearby, but it is not one of its main competitions.'},
 {type:'choice',q:'You meet a prize-winning bard. What has this person most likely done?',options:['Written or performed poetry','Designed a new football kit','Conducted a scientific experiment','Built a musical instrument'],a:0,why:'A bard is traditionally a poet. In Welsh culture, poetry has great importance, and outstanding poets may receive special honours.'},
 {type:'choice',q:'The gathering at Cardigan Castle took place in 1176. Which century was that?',options:['11th century','12th century','13th century','14th century'],a:1,why:'The years 1101–1200 are the 12th century. The gathering in 1176 is an early recorded ancestor of the Eisteddfod, not the start of today’s exact festival format.'},
 {type:'choice',q:'Why might an international visitor find the Eisteddfod especially interesting?',options:['It shows how a language and culture can be celebrated together','It proves that everyone in Wales speaks only Welsh','It is mainly a competition to design tourist attractions','It takes place only for people born in Wales'],a:0,why:'The Eisteddfod is a living celebration of language, music and community. Visitors can discover a part of Welsh identity that is easy to miss in ordinary sightseeing.'}
 ]
},
{
 code:'SCOTLAND',place:'Scotland',title:'The Midnight Visitor',subtitle:'Hogmanay',art:'scotland',scene:'A Scottish New Year mystery',
 intro:'You are spending New Year’s Eve with a Scottish host family. A few minutes after midnight, someone knocks on their door. They have a small gift, and everyone smiles. Why is this visitor so important?',
 clues:[
  ['Clue 01 · A different name','In Scotland, New Year’s Eve is often called Hogmanay. People celebrate with music, fireworks and visits to friends.'],
  ['Clue 02 · The first visitor','An old custom is first-footing (being the first person to enter someone’s home after midnight). Guests traditionally bring a small gift to wish the household good luck.'],
  ['Clue 03 · A familiar song','At midnight, people often sing “Auld Lang Syne”, a song associated with Scottish poet Robert Burns. Its words are about remembering old friends.']
 ],
 questions:[
 {type:'choice',q:'You have been invited to a Hogmanay party. When should you arrive?',options:['On 24 December','On 31 December','On the first Sunday in November','On the last Friday in January'],a:1,why:'Hogmanay is the Scottish name for New Year’s Eve, 31 December. Celebrations often continue into New Year’s Day.'},
 {type:'match',q:'Match these Scottish New Year words with their meanings.',pairs:[['First-footing','The first visit to a home after midnight'],['Auld Lang Syne','A song about remembering old friends'],['Hogmanay','The Scottish celebration of New Year’s Eve']],why:'These customs combine hospitality, music and hopes for a good year. “Auld Lang Syne” is now sung in many countries, not just Scotland.'},
 {type:'choice',q:'Which gift would be most traditional for someone arriving as the first visitor?',options:['A small piece of coal','A bunch of spring flowers','A box of Easter eggs','A school textbook'],a:0,why:'Coal traditionally represented warmth for the home. Shortbread (a rich Scottish biscuit) and other small gifts are also associated with first-footing.'},
 {type:'choice',q:'Why might people sing “Auld Lang Syne” while holding hands?',options:['To remember friendship and the passing year','To choose a winner of a music competition','To welcome the beginning of the school term','To practise a traditional military exercise'],a:0,why:'The song is about keeping old friendships in mind. People in Scotland and around the world sing it at midnight as the year changes.'},
 {type:'sort',q:'Sort these experiences into the correct cultural celebration.',categories:['Hogmanay','Eisteddfod'],items:[['First-footing after midnight',0],['Choirs competing on stage',1],['Singing Auld Lang Syne',0],['Poetry competitions',1]],why:'Hogmanay is about welcoming a new year; the Eisteddfod is about celebrating Welsh arts and language. Both bring communities together.'}
 ]
},
{
 code:'USA',place:'United States',title:'A Dinner with a History',subtitle:'Thanksgiving',art:'thanksgiving',scene:'A family dinner with a complex past',
 intro:'Your American host family are preparing a huge dinner in November. Everyone seems to have a favourite dish, but your host sister says the story behind the holiday is more complicated than the pictures in schoolbooks.',
 clues:[
  ['Clue 01 · The calendar','In the United States, Thanksgiving is celebrated on the fourth Thursday in November. Many people travel to spend the day with family or friends.'],
  ['Clue 02 · What’s for dinner?','Roast turkey, stuffing (a seasoned mixture often made with bread), cranberry sauce and pumpkin pie are common on modern Thanksgiving tables.'],
  ['Clue 03 · An older story','A harvest feast took place at Plymouth in 1621, involving English colonists and Wampanoag people. But relations between colonists and Indigenous peoples later included serious conflict.']
 ],
 questions:[
 {type:'choice',q:'Your American school is closed for Thanksgiving. Which date description fits the holiday?',options:['The first Monday in October','The fourth Thursday in November','The final Sunday in November','25 December every year'],a:1,why:'US Thanksgiving is on the fourth Thursday in November. Canada also celebrates Thanksgiving, but on the second Monday in October.'},
 {type:'match',q:'Match the Thanksgiving foods with the best descriptions.',pairs:[['Roast turkey','A large bird served as a main dish'],['Stuffing','A seasoned mixture often made with bread'],['Pumpkin pie','A sweet dessert made with spiced pumpkin']],why:'Many modern Thanksgiving dinners feature turkey, stuffing and pumpkin pie. The foods eaten at the 1621 harvest gathering were not identical to today’s menu.'},
 {type:'choice',q:'Which Indigenous nation is especially connected with the 1621 Plymouth harvest gathering?',options:['The Cherokee','The Māori','The Wampanoag','The Inuit'],a:2,why:'Wampanoag people had lived in the region long before the English colonists arrived. Their history is essential to understanding the events around 1621.'},
 {type:'choice',q:'The well-known Plymouth harvest feast happened in 1621. Which century does that belong to?',options:['15th century','16th century','17th century','18th century'],a:2,why:'The years 1601–1700 make up the 17th century. The 1621 event is often remembered in popular culture as the “First Thanksgiving”.'},
 {type:'choice',q:'Your host sister says, “A nice picture of one meal doesn’t tell the whole story.” What does she mean?',options:['The holiday is celebrated on different days every year','The real history includes Indigenous experiences and later conflict','No one knows whether any harvest feast happened','The holiday was originally invented by supermarkets'],a:1,why:'The 1621 gathering happened, but the familiar story often leaves out Indigenous perspectives and the later consequences of colonisation. Exploring more than one viewpoint gives a fuller picture.'}
 ]
},
{
 code:'FOOD',place:'Britain & USA',title:'The Curious Food Trail',subtitle:'Five dishes, five surprises',art:'food',scene:'What would you dare to eat?',
 intro:'At an international food market, you find a “pudding” that is not sweet, a Scottish speciality with unusual ingredients and a pie made from a vegetable. Can you work out what is really on the menu?',
 clues:[
  ['Clue 01 · Mind the word pudding','In British English, “pudding” often means dessert, but not always. Yorkshire pudding, for example, is usually served with roast meat and gravy (a sauce made from meat juices).'],
  ['Clue 02 · A Scottish speciality','Haggis is a traditional Scottish dish made with sheep’s offal (internal organs), oats and seasonings. It is often served with “neeps and tatties” (turnips or swede and potatoes).'],
  ['Clue 03 · Two festive desserts','Christmas pudding is a rich British dessert with dried fruit and spices. Pumpkin pie is a spiced American dessert often served at Thanksgiving.']
 ],
 questions:[
 {type:'choice',q:'Yorkshire pudding looks a bit like a small baked bowl. Which ingredients are normally used in its batter (liquid mixture before baking)?',options:['Eggs, flour and milk','Potatoes, cheese and cream','Rice, sugar and yoghurt','Apples, oats and butter'],a:0,why:'Yorkshire pudding is made from eggs, plain flour and milk, cooked in very hot fat. Despite the word “pudding”, it is savoury and is commonly served with a Sunday roast.'},
 {type:'choice',q:'Your Scottish host offers you haggis. What are you most likely eating?',options:['Spiced sheep’s organs with oats','Beef wrapped in puff pastry','Minced lamb in a tomato sauce','Potatoes baked with smoked salmon'],a:0,why:'Traditional haggis contains minced sheep’s heart, liver and lungs, plus oats, onion and seasoning. Vegetarian versions also exist. Kidneys are not the defining ingredient.'},
 {type:'choice',q:'Which description best matches an English steak and kidney pie?',options:['Beef and kidney in a savoury pastry case','Lamb and potatoes under a mashed potato topping','Chicken and mushrooms served with rice','Pork and apples baked under breadcrumbs'],a:0,why:'Steak and kidney pie is a British savoury pie, typically filled with beef and kidney in gravy. It is different from haggis, which is traditionally associated with Scotland.'},
 {type:'match',q:'Match each dish to the description you could give an exchange student.',pairs:[['Yorkshire pudding','A savoury baked batter served with a roast'],['Haggis','A Scottish dish with oats and offal'],['Christmas pudding','A British dessert rich in dried fruit'],['Pumpkin pie','An American spiced vegetable-based dessert']],why:'Names can be misleading: Yorkshire pudding is savoury, while pumpkin pie is sweet. Understanding food terms is part of understanding a culture.'},
 {type:'sort',q:'A food festival has three country tables. Where should you put these specialities?',categories:['England / Britain','Scotland','United States'],items:[['Steak and kidney pie',0],['Haggis',1],['Pumpkin pie',2],['Yorkshire pudding',0]],why:'Yorkshire pudding and steak and kidney pie are associated with England; haggis with Scotland; and pumpkin pie is especially associated with Thanksgiving in the USA. Food crosses borders, so these are cultural associations, not exclusive locations.'}
 ]
},
{
 code:'INVENTIONS',place:'Great Britain',title:'The Museum of Big Ideas',subtitle:'Inventions & discoveries',art:'inventions',scene:'A printing press, a telephone and a mystery dish',
 intro:'You enter a museum with three strange objects: an old printing press, an early telephone and a laboratory dish. Your guide says that each transformed everyday life. But the story also connects England, Scotland, Germany and America.',
 clues:[
  ['Clue 01 · Words for everyone','Johannes Gutenberg developed an influential movable-metal-type printing system in mainland Europe around 1450. William Caxton established England’s first printing press in Westminster in 1476.'],
  ['Clue 02 · A voice travelling through wires','Alexander Graham Bell was born in Scotland. In 1876, he received a US patent for a telephone design that helped transform communication. Other inventors also contributed to the development of the telephone.'],
  ['Clue 03 · An unexpected observation','In London in 1928, Alexander Fleming noticed something unusual growing in a laboratory dish. His observation opened the way to the development of penicillin, a life-saving antibiotic (medicine used to treat bacterial infections).']
 ],
 questions:[
 {type:'match',q:'Match each person to what they are best known for.',pairs:[['Johannes Gutenberg','A major advance in metal movable-type printing in Europe'],['William Caxton','Introducing the printing press to England'],['Alexander Graham Bell','A successful early telephone design and patent'],['Alexander Fleming','Discovering penicillin']],why:'Gutenberg worked earlier in mainland Europe; Caxton introduced printing technology into England. Bell patented a telephone design in 1876, while Fleming discovered penicillin in 1928.'},
 {type:'order',q:'The museum has mixed up the display cards. Put the events in order from earliest to latest.',items:[['Gutenberg’s printing system',1450],['Caxton’s printing press in England',1476],['Bell’s telephone patent',1876],['Fleming’s discovery of penicillin',1928]],why:'The approximate timeline is 1450 → 1476 → 1876 → 1928. The first two events happened within about a generation; the scientific discoveries came centuries later.'},
 {type:'choice',q:'A visitor says, “William Caxton invented printing.” What is the most accurate correction?',options:['He brought printing technology to England after it had developed on the Continent','He built the first printing machine in Europe in ancient times','He discovered how to print photographs on paper','He invented the telephone before Alexander Graham Bell'],a:0,why:'Caxton established a printing press in Westminster in 1476. Gutenberg’s important advances in printing with metal movable type in Europe came about 25 years earlier.'},
 {type:'choice',q:'What made Fleming’s observation in 1928 so important?',options:['It led to a treatment that could fight many bacterial infections','It produced the first medicine capable of curing every disease','It proved that all bacteria are dangerous to humans','It created a machine that could see inside the human body'],a:0,why:'Fleming saw that a mould had stopped bacteria growing near it. This led to penicillin, although other scientists later made it possible to produce the medicine in useful amounts.'},
 {type:'choice',q:'Gutenberg’s important printing developments came around 1450 and Caxton’s English press opened in 1476. Approximately how far apart were they?',options:['About 25 years','About 75 years','About 150 years','About 300 years'],a:0,why:'1476 minus 1450 is 26 years, so about 25 is the closest answer. Changes in technology often reach different countries at different times.'}

{
 code:'MYSTERY',place:'New York, USA',title:'The Great Balloon Mystery',subtitle:'A newspaper story from 1844',art:'balloon',scene:'Final mission · Can you believe the headline?',
 intro:'New York, 1844. A newspaper announces a miracle: a balloon has crossed the Atlantic Ocean in just three days! The story is packed with names and technical details. Readers are excited. You are a junior reporter: will you publish the story as fact?',
 clues:[
  ['Clue 01 · A dramatic headline','On 13 April 1844, The Sun newspaper in New York printed a sensational story about the balloon Victoria. It claimed the machine had crossed the Atlantic in 75 hours.'],
  ['Clue 02 · Very convincing details','The article included a route, descriptions of the balloon and names of people supposedly on board. Readers did not have the internet or instant ways to check the story.'],
  ['Clue 03 · A careful reporter','Balloon flight was real in the 1840s, but steering across an ocean was extremely difficult. Your editor asks for independent confirmation (evidence from a second reliable source) before making a final decision.']
 ],
 questions:[
 {type:'choice',q:'The newspaper article appeared in 1844. Which century was that?',options:['17th century','18th century','19th century','20th century'],a:2,why:'1844 is in the 19th century. Newspapers could spread striking stories quickly, even when checking a distant event was slow.'},
 {type:'choice',q:'The article claimed a flight of 75 hours. Which is the closest length of time?',options:['About three days','About one week','About two weeks','About one month'],a:0,why:'Three days are 72 hours, so 75 hours is three days and three hours. That speed would have sounded extraordinary for an Atlantic crossing in 1844.'},
 {type:'choice',q:'Before sharing the news, which evidence would be most useful?',options:['A second reliable report confirming the balloon’s arrival','A larger illustration of the balloon in the same paper','More exciting language in the original headline','A list of famous people who enjoy travelling'],a:0,why:'Independent confirmation is stronger evidence than extra details supplied by the same source. A convincing story is not automatically a true one.'},
 {type:'match',q:'Match each newspaper term with its role in checking a story.',pairs:[['Headline','A short title designed to attract attention'],['Diagram','An illustration that explains a design or idea'],['Independent source','A separate source used to check a claim'],['Retraction','A public statement correcting a published claim']],why:'A headline or diagram can make a report impressive, but only good evidence can help confirm it. A retraction is published when a report must be corrected.'},
 {type:'choice',q:'FINAL REVEAL: What was the amazing Atlantic balloon story really?',options:['A verified record-breaking flight','A real journey that ended in an accident','An invented newspaper story written by Edgar Allan Poe','A report about a ship with a confusing name'],a:2,why:'It was a hoax (a deliberately invented story) written by American author Edgar Allan Poe. The Sun published it on 13 April 1844 and retracted it soon afterwards. Poe had shown how realistic details could fool readers — a lesson that still matters online.'}
 ]
}

const STORAGE_KEY='culture-without-borders-erasmus-v1';
const ABCD=['A','B','C','D'];
const esc = x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
MISSIONS.forEach((m,mi)=>m.questions.forEach((q,qi)=>{
 if(q.type==='choice'){
  const orig=q.options.map((label,i)=>({label,correct:i===q.a}));
  const shift=(mi*3+qi*2+1)%4;
  q.shuffled=orig.slice(shift).concat(orig.slice(0,shift));
 }
}));
let saved;
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){saved={}}
let state={completed:[],answers:{},name:'',...saved};
if(!Array.isArray(state.completed))state.completed=[];
if(!state.answers||typeof state.answers!=='object')state.answers={};
let view={screen:'home',mid:0,qi:0,retry:false};
const root=document.getElementById('app');
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function syncViewTop(){window.scrollTo({top:0,behavior:'instant'});document.getElementById('stamp-number').textContent=`${state.completed.length}/6`}
function update(markup){root.innerHTML=markup;syncViewTop()}
function back(){return `<button class="back" onclick="goHome()">← Cultural passport</button>`}
function art(k,cl='cover'){return `<img class="${cl}" src="${ART[k]}" alt="Original illustration connected with ${esc(k)}" loading="eager">`}
function banner(m,i){return `${art(m.art)}<div class="cover-label"><div class="micro">Mission ${String(i+1).padStart(2,'0')} · ${esc(m.place)}</div><h2>${esc(m.title)}</h2><p>${esc(m.subtitle)}</p></div>`}
function notes(m){return `<div class="notes">${m.clues.map(c=>`<div class="note"><b>${esc(c[0])}</b><p>${esc(c[1])}</p></div>`).join('')}</div>`}
function noteDialog(m){return `<dialog id="clue-dialog"><div class="dialog-head"><h2>Passport clues</h2><button aria-label="Close clues" onclick="closeClues()">×</button></div><div class="dialog-inner">${notes(m)}</div></dialog>`}
function openClues(){document.getElementById('clue-dialog').showModal()}
function closeClues(){document.getElementById('clue-dialog').close()}
function foodGallery(){let foods=[['yorkshire','Yorkshire pudding'],['haggis','Haggis'],['kidney','Steak & kidney pie'],['christmas','Christmas pudding'],['pumpkin','Pumpkin pie']];return `<div class="food-gallery">${foods.map(([id,label])=>`<div class="food-tile"><img src="${ART[id]}" alt="Illustration of ${esc(label)}"><span>${esc(label)}</span></div>`).join('')}</div>`}
function goHome(){view={screen:'home',mid:0,qi:0,retry:false};render()}
function goIntro(mid){if(mid>state.completed.length)return;view={screen:'intro',mid,qi:0,retry:false};render()}
function ensure(mid){const key=String(mid);if(!Array.isArray(state.answers[key]))state.answers[key]=Array(5).fill(null);return state.answers[key]}
function beginMission(mid){ensure(mid);if(state.completed.includes(mid)){view={screen:'result',mid,qi:0,retry:false}}else{let start=ensure(mid).findIndex(v=>v===null);view={screen:start<0?'result':'question',mid,qi:start<0?0:start,retry:false}}render()}
function labelKind(type){return {choice:'Choose one answer',match:'Match the pairs',sort:'Sort into groups',order:'Put in order'}[type]}
function renderHome(){const n=state.completed.length;update(`<section class="hero"><div class="hero-mark"></div><div class="micro">Erasmus+ · Your cultural passport</div><h1>Culture<br><em>Without</em><br>Borders.</h1><p>Travel through fascinating traditions, surprising food, brilliant inventions and one unbelievable newspaper mystery.</p></section><div class="stats"><div class="stat"><strong>6</strong><span>Destinations</span></div><div class="stat"><strong>30</strong><span>Challenges</span></div><div class="stat"><strong>${n}</strong><span>Stamps earned</span></div></div><div class="title-row"><h2>Choose your next stop</h2><span>${n}/6 unlocked</span></div><div class="missions">${MISSIONS.map((m,i)=>{let locked=i>n,done=state.completed.includes(i);return `<button class="mission ${locked?'locked':i===n?'open':''}" ${locked?'disabled':''} onclick="goIntro(${i})"><span class="mission-number">${done?'✓':i+1}</span><span class="mission-text"><strong>${esc(m.place)}</strong><small>${esc(m.subtitle)}</small></span><span class="status ${locked?'locked':''}">${done?'Stamped':locked?'Locked':'Explore →'}</span></button>`}).join('')}</div><p class="home-foot">Read the clues, solve five tasks and earn a stamp. The next destination unlocks when all five answers are correct.</p>`)}
function renderIntro(mid){const m=MISSIONS[mid];update(`${back()}<section class="card">${banner(m,mid)}<div class="card-body"><p class="intro">${esc(m.intro)}</p><h3 class="notes-heading">Your field notes</h3>${notes(m)}${mid===3?`<h3 class="notes-heading">The food gallery</h3>${foodGallery()}`:''}<div class="tip"><b>How to play:</b> Use the clues to work things out. There are five tasks in this destination. After you finish, you'll discover the real answers and some extra facts.</div><button class="btn" onclick="beginMission(${mid})">${state.completed.includes(mid)?'Review this mission':'Start the five tasks'} →</button></div></section>`)}
function orderInit(mid,qi,q){let arr=ensure(mid);if(!Array.isArray(arr[qi])){arr[qi]=[2,0,3,1].filter(x=>x<q.items.length);persist()}return arr[qi]}
function answerValue(mid,qi){return ensure(mid)[qi]}
function requiredReady(mid,qi){const q=MISSIONS[mid].questions[qi],a=answerValue(mid,qi);if(q.type==='choice')return Number.isInteger(a);if(q.type==='match'||q.type==='sort')return a&&typeof a==='object'&&Object.keys(a).length===(q.type==='match'?q.pairs.length:q.items.length);if(q.type==='order')return Array.isArray(a)&&a.length===q.items.length;return false}
function answerUI(mid,qi,q){const answer=answerValue(mid,qi);
 if(q.type==='choice')return `<div class="answers">${q.shuffled.map((opt,i)=>`<button class="answer ${answer===i?'selected':''}" aria-pressed="${answer===i}" onclick="selectChoice(${mid},${qi},${i})"><span class="letter">${ABCD[i]}</span><span>${esc(opt.label)}</span></button>`).join('')}</div>`;
 if(q.type==='match'){
  let choices=q.pairs.map(p=>p[1]);let sorted=choices.slice().sort((a,b)=>a.localeCompare(b)).reverse();return q.pairs.map(([left,right],i)=>`<div class="mini-card"><label for="match${i}">${esc(left)}</label><select id="match${i}" onchange="setDropdown(${mid},${qi},${i},this.value)"><option value="">Choose a meaning…</option>${sorted.map(c=>`<option value="${esc(c)}" ${answer&&answer[i]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')}
 if(q.type==='sort')return q.items.map(([label],i)=>`<div class="mini-card"><label for="cat${i}">${esc(label)}</label><select id="cat${i}" onchange="setDropdown(${mid},${qi},${i},this.value)"><option value="">Choose a group…</option>${q.categories.map((cat,j)=>`<option value="${j}" ${answer&&answer[i]===String(j)?'selected':''}>${esc(cat)}</option>`).join('')}</select></div>`).join('');
 if(q.type==='order'){let positions=orderInit(mid,qi,q);return `<div class="order-list">${positions.map((orig,pos)=>`<div class="order-item"><span class="order-num">${pos+1}.</span><span class="order-label">${esc(q.items[orig][0])}</span><span class="arrows"><button aria-label="Move ${esc(q.items[orig][0])} up" ${pos===0?'disabled':''} onclick="moveOrder(${mid},${qi},${pos},-1)">↑</button><button aria-label="Move ${esc(q.items[orig][0])} down" ${pos===positions.length-1?'disabled':''} onclick="moveOrder(${mid},${qi},${pos},1)">↓</button></span></div>`).join('')}</div><p class="helper">Use the arrows to put the oldest event at the top.</p>`}
 return '';
}
function renderQuestion(mid,qi){const m=MISSIONS[mid],q=m.questions[qi];let ready=requiredReady(mid,qi);update(`${back()}<div class="progress-top"><span>Mission ${mid+1} of 6 · ${esc(m.place)}</span><span>Task ${qi+1} / 5</span></div><div class="track"><i style="width:${((qi+1)/5)*100}%"></i></div><div class="card" style="margin-top:17px">${art(m.art,'cover cover-compact')}<div class="card-body"><span class="kind">${labelKind(q.type)}</span><div class="quiz-header"><h2>${esc(q.q)}</h2></div>${answerUI(mid,qi,q)}<p class="helper">You can reopen your field notes at any point.</p><div class="btn-row"><button class="btn" id="continue" onclick="nextQuestion()" ${ready?'':'disabled'}>${qi===4?'Check my answers':'Continue'} →</button><button class="btn outline mini" onclick="openClues()">Clues</button></div></div></div>${noteDialog(m)}`)}
function selectChoice(mid,qi,value){ensure(mid)[qi]=value;persist();document.querySelectorAll('.answer').forEach((b,i)=>{b.classList.toggle('selected',i===value);b.setAttribute('aria-pressed',String(i===value))});let btn=document.getElementById('continue');if(btn)btn.disabled=false}
function setDropdown(mid,qi,index,value){const arr=ensure(mid);if(!arr[qi]||typeof arr[qi]!=='object'||Array.isArray(arr[qi]))arr[qi]={};if(value==='')delete arr[qi][index];else arr[qi][index]=value;persist();const b=document.getElementById('continue');if(b)b.disabled=!requiredReady(mid,qi)}
function moveOrder(mid,qi,pos,delta){let ans=orderInit(mid,qi,MISSIONS[mid].questions[qi]);let at=pos+delta;if(at<0||at>=ans.length)return;[ans[pos],ans[at]]=[ans[at],ans[pos]];persist();const list=document.querySelector('.order-list');if(list)list.outerHTML=answerUI(mid,qi,MISSIONS[mid].questions[qi]);const btn=document.getElementById('continue');if(btn)btn.disabled=false}
function correct(mid,qi){const q=MISSIONS[mid].questions[qi],a=ensure(mid)[qi];if(q.type==='choice')return a!==null&&Boolean(q.shuffled[a]?.correct);if(q.type==='match')return q.pairs.every(([label,meaning],i)=>a&&a[i]===meaning);if(q.type==='sort')return q.items.every((it,i)=>a&&a[i]===String(it[1]));if(q.type==='order')return Array.isArray(a)&&a.every((v,i)=>v===i);return false}
function nextQuestion(){let {mid,qi,retry}=view;if(!requiredReady(mid,qi))return;let next=qi+1;if(retry){while(next<5&&correct(mid,next))next++}if(next<5){view.qi=next;render()}else{view.screen='result';render()}}
function correctDisplay(q){if(q.type==='choice')return esc(q.shuffled.find(x=>x.correct).label);if(q.type==='match')return q.pairs.map(([a,b])=>`<span><b>${esc(a)}:</b> ${esc(b)}</span>`).join('');if(q.type==='sort')return q.items.map(([a,b])=>`<span><b>${esc(a)}:</b> ${esc(q.categories[b])}</span>`).join('');if(q.type==='order')return q.items.map(([label],i)=>`<span>${i+1}. ${esc(label)}</span>`).join('')}
function wrongDisplay(mid,qi){const q=MISSIONS[mid].questions[qi],a=ensure(mid)[qi];if(q.type==='choice'&&Number.isInteger(a))return `<p class="small muted">Your answer: ${esc(q.shuffled[a].label)}</p>`;return ''}
function renderResult(mid){const m=MISSIONS[mid],score=m.questions.reduce((n,q,i)=>n+(correct(mid,i)?1:0),0);if(score===5&&!state.completed.includes(mid)){state.completed.push(mid);state.completed.sort((a,b)=>a-b);persist()}const complete=score===5;update(`${back()}<div class="card"><div class="result-banner"><span class="micro">${esc(m.place)} · Your discoveries</span><strong>${score}/5</strong><h2>${complete?'Passport stamp earned!':'A little more exploring…'}</h2><p>${complete?'All five tasks solved. Your next destination is now unlocked.':'Read the facts below, then correct your missing answers to continue.'}</p></div></div><h2 class="notes-heading">Discover the real stories</h2><div class="feedback">${m.questions.map((q,i)=>{let good=correct(mid,i);return `<section class="feedback-item ${good?'correct':'wrong'}"><div class="micro">Task ${i+1} · ${good?'Correct':'Try again'}</div><h3>${esc(q.q)}</h3>${wrongDisplay(mid,i)}<div class="feedback-key"><strong>${good?'Answer':'Correct answer'}:</strong><div class="answer-map">${correctDisplay(q)}</div></div><p class="fact"><b>Did you know?</b> ${esc(q.why)}</p></section>`}).join('')}</div><button class="btn" onclick="${complete?(mid===MISSIONS.length-1?'showFinish()':`goIntro(${mid+1})`):'retryWrong()'}">${complete?(mid===MISSIONS.length-1?'Finish the challenge →':'Unlock next destination →'):'Correct the missing answers →'}</button><p class="foot-note" style="text-align:center">${complete?'Your progress has been saved in this browser.':'You only need to retry the questions you missed.'}</p>`)}
function retryWrong(){let mid=view.mid;for(let i=0;i<5;i++){if(!correct(mid,i))ensure(mid)[i]=null}persist();let first=ensure(mid).findIndex(v=>v===null);view={screen:'question',mid,qi:Math.max(first,0),retry:true};render()}
function showFinish(){if(state.completed.length<6)return;view.screen='finish';render()}
function renderFinish(){update(`<div class="congrats"><div class="micro">Your Erasmus+ cultural passport</div><div class="seal">MISSION<br>COMPLETE</div><h1>You've made it<br>around the world!</h1><p>6 destinations explored<br>30 challenges completed<br>1 incredible journey</p><p class="final-quote">The world is full of amazing stories. Stay curious, ask questions and don't believe everything you read!</p><p>From Welsh poetry and Scottish celebrations to unusual foods and life-changing discoveries — you have explored how cultures connect. And you've uncovered Edgar Allan Poe's Great Balloon Hoax of 1844.</p></div><h2 class="notes-heading">Your passport stamps</h2><div class="stampgrid">${MISSIONS.map(m=>`<div class="stamp">✓ ${esc(m.place)}</div>`).join('')}</div><div class="card"><div class="card-body"><div class="micro">Certificate of discovery</div><h2 style="font-size:29px;margin:12px 0">Culture Without Borders</h2><p>This certificate celebrates your curiosity, cultural discoveries and critical thinking.</p><label for="student-name" class="small">Your name (optional)</label><input class="name" id="student-name" placeholder="Enter your name" value="${esc(state.name||'')}" oninput="saveName(this.value)" maxlength="65"><button class="btn" onclick="window.print()">Print or save certificate</button></div></div><div style="margin-top:17px"><button class="btn outline" onclick="goHome()">See my cultural passport</button></div>`)}
function saveName(v){state.name=v;persist()}
function render(){if(view.screen==='home')renderHome();if(view.screen==='intro')renderIntro(view.mid);if(view.screen==='question')renderQuestion(view.mid,view.qi);if(view.screen==='result')renderResult(view.mid);if(view.screen==='finish')renderFinish()}
function restart(){if(confirm('Restart this challenge? This will erase your saved stamps and answers in this browser.')){state={completed:[],answers:{},name:''};persist();goHome()}}
if(state.completed.length===MISSIONS.length){view.screen='home'}
render();
</script>
</body>
</html>
